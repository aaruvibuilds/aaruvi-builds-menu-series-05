<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AARUVI BUILDS - Magnetic Menu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <div class="glow glow-a"></div>
    <div class="glow glow-b"></div>

    <div class="brand">AARUVI BUILDS</div>

    <div class="menu-stage" id="menuStage">
      <button class="menu-button" id="menuButton" type="button" aria-label="Open menu" aria-expanded="false">
        <span class="button-label" id="buttonLabel">MENU</span>
        <span class="hamburger" id="hamburger" aria-hidden="true">
          <i></i><i></i>
        </span>
        <span class="close-icon" id="closeIcon" aria-hidden="true">
          <i></i><i></i>
        </span>
      </button>

      <div class="menu-card" id="menuCard" aria-hidden="true">
        <div class="card-top">
          <span>NAVIGATION</span>
          <span>01 — 04</span>
        </div>

        <nav class="links" aria-label="Main navigation">
          <a href="#" class="menu-link">
            <span class="number">01</span>
            <span class="title">Home</span>
          </a>
          <a href="#" class="menu-link">
            <span class="number">02</span>
            <span class="title">Work</span>
          </a>
          <a href="#" class="menu-link">
            <span class="number">03</span>
            <span class="title">About</span>
          </a>
          <a href="#" class="menu-link">
            <span class="number">04</span>
            <span class="title">Contact</span>
          </a>
        </nav>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
